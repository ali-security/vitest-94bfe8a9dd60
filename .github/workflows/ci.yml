name: CI

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional test name/path filter passed to the test runner'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  VITEST_GENERATE_UI_TOKEN: 'true'

jobs:
  test:
    name: 'Build&Test: node-${{ matrix.node_version }}, ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}

    timeout-minutes: 50

    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [20, 22, 24]
        include:
          - os: macos-latest
            node_version: 24
          - os: windows-latest
            node_version: 24
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: ${{ matrix.node_version }}

      - uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1

      - name: Install
        run: pnpm i

      - uses: ./.github/actions/setup-playwright

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:ci ${{ inputs.test-filter }}

      - name: Test Examples
        run: pnpm run test:examples ${{ inputs.test-filter }}

      - name: Pack @vitest/mocker
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node_version == 20 }}
        working-directory: packages/mocker
        run: |
          pnpm pack
          mv vitest-mocker-4.1.2.tgz mocker-4.1.2.tgz

      - name: Upload @vitest/mocker tarball
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node_version == 20 }}
        uses: actions/upload-artifact@v7
        with:
          name: mocker-tgz
          path: packages/mocker/mocker-4.1.2.tgz
          if-no-files-found: error

  test-cached:
    name: 'Cache&Test: node-${{ matrix.node_version }}, ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}

    timeout-minutes: 50

    strategy:
      matrix:
        node_version: [24]
        os:
          - macos-latest
          - windows-latest
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: ${{ matrix.node_version }}

      - uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1

      - name: Install
        run: pnpm i

      - uses: ./.github/actions/setup-playwright

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:ci:cache ${{ inputs.test-filter }}

  test-browser:
    name: 'Browsers: node-${{ matrix.node_version }}, ${{ matrix.os }}'

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node_version: [24]
        os:
          - macos-latest
          - windows-latest
      fail-fast: false

    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: ${{ matrix.node_version }}

      - uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1
      - uses: browser-actions/setup-firefox@fcf821c621167805dd63a29662bd7cb5676c81a8 # v1.7.1

      - name: Install
        run: pnpm i

      - uses: ./.github/actions/setup-playwright

      - name: Build
        run: pnpm run build

      - name: Test Browser (playwright)
        run: pnpm run test:browser:playwright ${{ inputs.test-filter }}

      - name: Test Browser (webdriverio)
        run: pnpm run test:browser:webdriverio ${{ inputs.test-filter }}

  # The upstream `test-rolldown` job is dropped here. It does not build or test the
  # released package: it rewrites `pnpm-workspace.yaml` to alias vite to an unpinned
  # `npm:vite@8` (rolldown-vite) and re-resolves the whole graph with
  # `--no-frozen-lockfile`, i.e. a forward-compatibility probe that is by
  # construction not reproducible for a fixed release. On the fork it fails on
  # rolldown-specific stack-trace column offsets in `test/cli` snapshots and on
  # `test/coverage-test` query-param transforms — differences of the alternate
  # bundler, not of this package. Every suite it ran (`test:ci`, `test:examples`,
  # `test:browser:playwright`) still runs against the pinned vite in the `test`,
  # `test-cached` and `test-browser` jobs above, so no test leaves the run set.
